name: Generate LeetCode Submission Snake
on:
  workflow_dispatch:
  schedule:
    - cron: '15 1 * * *'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate LeetCode activity animation
        env:
          LEETCODE_USERNAME: anie25
        run: python scripts/generate.py
      - name: Publish animations
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
